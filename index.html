<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Heart - Yuleb Love</title>
<style>
html,body{margin:0;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;}
canvas{display:block;}
#title{position:fixed;top:25px;left:30px;z-index:100;pointer-events:none;}
#title h1{margin:0;color:white;font-size:28px;letter-spacing:3px;text-shadow:0 0 10px #fff,0 0 20px rgba(255,255,255,.7),0 0 40px rgba(255,150,255,.5);}
#title p{margin-top:8px;color:#d0d0d0;font-size:13px;opacity:.8;}
#planetUI{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:.5s;z-index:10000;}
#planetUI.active{opacity:1;pointer-events:auto;}
#planetCard{width:420px;max-width:88vw;padding:40px;border-radius:30px;background:linear-gradient(135deg,rgba(15,15,40,.95),rgba(30,10,50,.92));border:1px solid rgba(255,255,255,.08);color:white;text-align:center;backdrop-filter:blur(15px);transform:scale(.8);transition:.5s;}
#planetUI.active #planetCard{transform:scale(1);}
#planetTitle{font-size:38px;margin-bottom:20px;color:#ffd9ff;}
#planetMessage{font-size:18px;line-height:1.8;color:#ddd;max-height:350px;overflow-y:auto;}
#closeBtn{margin-top:30px;border:none;padding:14px 28px;border-radius:50px;background:linear-gradient(90deg,#ff66cc,#8c6bff);color:white;font-size:16px;cursor:pointer;}
.floatText{position:fixed;left:0;top:0;color:white;font-weight:600;pointer-events:none;z-index:999;opacity:0;text-shadow:0 0 15px currentColor;animation:flyText linear forwards;}
@keyframes flyText{0%{opacity:0;transform:translate(0,0) scale(.4);}10%{opacity:1;}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.3);}}
.miniHeart{position:fixed;width:14px;height:14px;background:white;transform:rotate(-45deg);pointer-events:none;z-index:999;opacity:0;box-shadow:0 0 10px rgba(255,255,255,.8);animation:heartFly linear forwards;}
.miniHeart::before,.miniHeart::after{content:'';position:absolute;width:100%;height:100%;background:white;border-radius:50%;}
.miniHeart::before{top:-50%;left:0;}
.miniHeart::after{left:50%;top:0;}
@keyframes heartFly{0%{opacity:0;transform:translate(0,0) rotate(-45deg) scale(.3);}15%{opacity:1;}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(-45deg) scale(1.4);}}
#cameraControls{position:fixed;left:30px;bottom:28px;display:flex;flex-direction:column;gap:14px;z-index:999999;}
#cameraControls button{width:70px;height:70px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:white;font-size:34px;cursor:pointer;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);}
#calebSphere{position:fixed;right:30px;bottom:28px;width:52px;height:52px;border-radius:50%;cursor:pointer;z-index:999999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#9b7dff,#ff66cc);box-shadow:0 0 30px rgba(155,125,255,.5);border:2px solid rgba(255,255,255,.2);transition:.35s;}
#calebSphere:hover{transform:scale(1.15);}
#calebSphere.dim{opacity:.3;filter:blur(3px);transform:scale(.88);}
#calebSphere span{font-size:26px;}
#perfBadge{position:fixed;left:30px;top:25px;font-size:10px;color:rgba(255,255,255,.35);z-index:999999;letter-spacing:1px;pointer-events:none;}
#ghBackBtn{position:fixed;top:25px;right:30px;padding:12px 22px;border-radius:50px;border:1px solid rgba(255,220,180,.3);background:rgba(20,14,10,.55);color:#ffe9c9;font-size:13px;cursor:pointer;z-index:999999;backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:.4s;display:flex;align-items:center;gap:8px;}
#ghBackBtn.show{opacity:1;pointer-events:auto;}

/* PLAYLIST */
#playlistPanel{position:fixed;right:0;top:0;width:340px;max-width:92vw;height:100vh;background:linear-gradient(180deg,rgba(14,12,24,.98),rgba(9,8,18,.99));border-left:1px solid rgba(255,255,255,.08);transform:translateX(100%);transition:.4s cubic-bezier(.2,.8,.2,1);z-index:999998;display:flex;flex-direction:column;backdrop-filter:blur(20px);}
#playlistPanel.open{transform:translateX(0);}
#plScroll{flex:1;overflow-y:auto;overscroll-behavior:contain;}
#plScroll::-webkit-scrollbar{width:5px;}
#plScroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
#playlistHeader{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
#playlistTitle{color:rgba(255,255,255,.9);font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.7;}
#closePlaylist{width:30px;height:30px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:white;cursor:pointer;font-size:14px;}

/* Hero now-playing card */
#nowHero{margin:0 18px 14px;height:190px;border-radius:22px;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,rgba(155,125,255,.55),transparent 60%),radial-gradient(circle at 75% 80%,rgba(255,102,204,.5),transparent 55%),linear-gradient(160deg,#1a1030,#120a22);display:flex;align-items:center;justify-content:center;}
#nowHeroGlyph{font-size:52px;filter:drop-shadow(0 0 18px rgba(255,150,220,.6));animation:heroPulse 2.4s ease-in-out infinite;}
@keyframes heroPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
#nowHeroLabel{position:absolute;left:16px;bottom:12px;right:16px;}
#nowHeroLabel .k{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:1.5px;text-transform:uppercase;}

#nowName{color:#fff;font-size:17px;font-weight:700;margin:0 20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#nowArtist{color:rgba(255,255,255,.45);font-size:11px;margin:4px 20px 0;}

#progressBar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin:18px 20px 6px;cursor:pointer;position:relative;}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#9b7dff,#ff66cc);border-radius:3px;position:relative;}
#progressFill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);}
#timeRow{display:flex;justify-content:space-between;margin:0 20px;font-size:10.5px;color:rgba(255,255,255,.4);}

#transportRow{display:flex;align-items:center;justify-content:space-between;margin:20px 26px 4px;}
#transportRow button{border:none;background:none;color:rgba(255,255,255,.8);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.tIcon{width:38px;height:38px;font-size:19px;}
.tIcon.active{color:#ff8ad8;}
#mainPlayBtn{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#9b7dff,#ff66cc);color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(155,90,255,.4);}

#secondaryRow{display:flex;align-items:center;justify-content:center;gap:34px;margin:14px 0 6px;}
#secondaryRow button{border:none;background:none;color:rgba(255,255,255,.55);font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
#secondaryRow button span.ic{font-size:17px;}
#secondaryRow button.active{color:#ff8ad8;}

#queueSection{margin-top:10px;padding:0 18px 14px;}
#queueHeader{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 8px;border-top:1px solid rgba(255,255,255,.06);}
#queueHeader .qt{color:rgba(255,255,255,.85);font-size:13px;font-weight:700;}
#queueHeader .qc{color:rgba(255,255,255,.35);font-size:10.5px;}

.playlistItem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;margin-bottom:4px;cursor:pointer;transition:.2s;border:1px solid transparent;}
.playlistItem:hover{background:rgba(255,255,255,.05);}
.playlistItem.playing{background:linear-gradient(90deg,rgba(155,125,255,.22),rgba(255,102,204,.08));border-color:rgba(155,125,255,.25);}
.itemThumb{width:40px;height:40px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;background:linear-gradient(135deg,#7d5cff,#ff7de0);color:#fff;position:relative;}
.itemThumb .bars{display:none;gap:2px;}
.playlistItem.playing .itemThumb .bars{display:flex;}
.playlistItem.playing .itemThumb .glyph{display:none;}
.itemThumb .bars span{width:3px;height:10px;background:#fff;border-radius:2px;animation:bar .6s infinite;}
.itemThumb .bars span:nth-child(2){animation-delay:.15s;}
.itemThumb .bars span:nth-child(3){animation-delay:.3s;}
@keyframes bar{0%,100%{height:5px;}50%{height:15px;}}
.itemInfo{flex:1;min-width:0;}
.itemName{color:#fff;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.itemArtist{color:rgba(255,255,255,.4);font-size:10px;margin-top:1px;}
.itemArtist.pending{color:#ffcf7a;}
.itemDel{width:26px;height:26px;border:none;border-radius:8px;background:rgba(255,80,80,.15);color:rgba(255,150,150,.85);font-size:12px;cursor:pointer;opacity:0;transition:.2s;flex-shrink:0;}
.playlistItem:hover .itemDel{opacity:1;}
.itemDel:hover{background:rgba(255,80,80,.45);color:#fff;}
.itemDel.loading{opacity:1;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#addSection{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px;}
#selectFileBtn{padding:11px;border-radius:10px;background:rgba(155,125,255,.35);color:#fff;border:none;cursor:pointer;font-size:11.5px;font-weight:600;}
#fileName{color:rgba(255,255,255,.5);font-size:9.5px;text-align:center;}
#customNameInput{padding:9px 12px;border-radius:8px;border:1px solid rgba(155,125,255,.3);background:rgba(255,255,255,.06);color:#fff;font-size:11.5px;display:none;}
#customNameInput::placeholder{color:rgba(255,255,255,.3);}
#uploadBtn{padding:11px;border-radius:10px;background:linear-gradient(90deg,#9b7dff,#ff66cc);color:#fff;border:none;cursor:pointer;font-size:11.5px;font-weight:600;display:none;}
#uploadStatus{font-size:9.5px;color:rgba(255,255,255,.4);text-align:center;}
#tokenRow{display:flex;gap:6px;align-items:center;}
#tokenInput{flex:1;padding:8px 10px;border-radius:8px;border:1px solid rgba(155,125,255,.3);background:rgba(255,255,255,.06);color:#fff;font-size:10px;}
#tokenInput::placeholder{color:rgba(255,255,255,.3);}
#saveTokenBtn{padding:8px 10px;border:none;border-radius:8px;background:rgba(155,125,255,.4);color:#fff;font-size:10px;cursor:pointer;white-space:nowrap;}
#saveTokenBtn.saved{background:rgba(80,200,80,.4);}
#tokenStatus{font-size:9px;color:rgba(255,255,255,.4);text-align:center;}

/* VIDEO FLOTANTE */
#videoContainer{position:fixed;bottom:120px;right:360px;width:380px;background:rgba(10,10,20,.95);border:1px solid rgba(155,125,255,.4);border-radius:16px;overflow:hidden;z-index:999997;display:none;flex-direction:column;box-shadow:0 0 40px rgba(155,125,255,.2);}
#videoContainer.visible{display:flex;}
#videoHeader{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(155,125,255,.15);cursor:grab;user-select:none;}
#videoHeader:active{cursor:grabbing;}
#videoHeaderTitle{color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin-right:8px;}
#videoHeaderBtns{display:flex;gap:6px;flex-shrink:0;}
#videoHeaderBtns button{width:26px;height:26px;border:none;border-radius:6px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:13px;cursor:pointer;transition:.2s;}
#fullscreenBtn{background:rgba(155,125,255,.3)!important;}
#closeVideoBtn{background:rgba(255,80,80,.3)!important;}
#mainVideo{width:100%;aspect-ratio:16/9;background:#000;display:block;}
#videoContainer.fs{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border-radius:0!important;border:none!important;}
#videoContainer.fs #mainVideo{width:100%;height:calc(100vh - 36px);object-fit:contain;}
#resizeHandle{position:absolute;bottom:0;right:0;width:18px;height:18px;cursor:se-resize;opacity:.4;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px;}
#resizeHandle::after{content:'';width:8px;height:8px;border-right:2px solid #9b7dff;border-bottom:2px solid #9b7dff;}

/* TOAST */
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(30,20,50,.95);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;z-index:9999999;opacity:0;transition:.3s;border:1px solid rgba(155,125,255,.4);pointer-events:none;max-width:80vw;text-align:center;}
#toast.show{opacity:1;}
</style>
</head>
<body>

<div id="toast"></div>
<div id="perfBadge"></div>
<button id="ghBackBtn">← Volver</button>

<div id="title"><h1>Yuleb</h1><p>Te amo tanto tanto tanto</p></div>

<div id="planetUI">
  <div id="planetCard">
    <h1 id="planetTitle"></h1>
    <div id="planetMessage"></div>
    <button id="closeBtn">Cerrar</button>
  </div>
</div>

<div id="cameraControls">
  <button id="zoomIn">＋</button>
  <button id="zoomOut">－</button>
</div>

<div id="calebSphere"><span>💜</span></div>

<!-- VIDEO FLOTANTE -->
<div id="videoContainer">
  <div id="videoHeader">
    <div id="videoHeaderTitle">Sin video</div>
    <div id="videoHeaderBtns">
      <button id="fullscreenBtn" title="Pantalla completa">⛶</button>
      <button id="closeVideoBtn" title="Cerrar">✕</button>
    </div>
  </div>
  <video id="mainVideo" controls></video>
  <div id="resizeHandle"></div>
</div>

<!-- PLAYLIST -->
<div id="playlistPanel">
  <div id="plScroll">
    <div id="playlistHeader">
      <div id="playlistTitle">💜 Yuleb' Playlist</div>
      <button id="closePlaylist">✕</button>
    </div>

    <div id="nowHero">
      <div id="nowHeroGlyph">💜</div>
      <div id="nowHeroLabel"><div class="k">Reproduciendo ahora</div></div>
    </div>
    <div id="nowName">Sin videos</div>
    <div id="nowArtist">Sube un video a la carpeta SONGS/</div>

    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="timeRow"><span id="timeCur">0:00</span><span id="timeRest">-0:00</span></div>

    <div id="transportRow">
      <button id="shuffleBtn" class="tIcon" title="Aleatorio"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></button>
      <button id="back15Btn" class="tIcon" title="Retroceder 15s">⟲15</button>
      <button id="mainPlayBtn" title="Reproducir">▶</button>
      <button id="fwd15Btn" class="tIcon" title="Adelantar 15s">⟳15</button>
      <button id="repeatBtn" class="tIcon" title="Repetir"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>
    </div>

    <div id="secondaryRow">
      <button id="speedBtn"><span class="ic">⏱</span>1x</button>
      <button id="muteBtn"><span class="ic" id="muteIcon">🔊</span>Sonido</button>
      <button id="fsBtn"><span class="ic">⛶</span>Pantalla</button>
    </div>

    <div id="queueSection">
      <div id="queueHeader"><span class="qt">A continuación</span><span class="qc" id="queueCount">0 videos</span></div>
      <div style="margin:-4px 2px 8px;font-size:9.5px;color:rgba(255,255,255,.3);">Ordenadas: las más escuchadas primero</div>
      <div id="playlistContent"></div>
    </div>
  </div>

  <div id="addSection">
    <input id="uploadFile" type="file" accept=".mp4,.mp3,.wav" style="display:none;">
    <button id="selectFileBtn">📁 Seleccionar video</button>
    <div id="fileName"></div>
    <input id="customNameInput" type="text" placeholder="Nombre con el que se guardará">
    <button id="uploadBtn">⬆️ Subir</button>
    <div id="uploadStatus"></div>
    <div id="tokenRow">
      <input id="tokenInput" type="password" placeholder="GitHub Token (para subir/eliminar)">
      <button id="saveTokenBtn">Guardar</button>
    </div>
    <div id="tokenStatus">Token: no configurado</div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0'
import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js'
import { EffectComposer } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js'
import { RenderPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js'

/* ============================
   CONFIG — CAMBIA ESTOS DATOS
   ============================ */
const GITHUB_OWNER = "jimy1104"
const GITHUB_REPO  = "galaxy-heart"
const GITHUB_BRANCH = "master"
/* ============================ */

// Toast
function toast(msg, duration=2800){
  const t=document.getElementById("toast")
  t.innerText=msg; t.classList.add("show")
  setTimeout(()=>t.classList.remove("show"),duration)
}

/* ============================
   DETECCIÓN DE RENDIMIENTO
   Baja automáticamente la densidad de partículas
   en equipos con menos núcleos/memoria/pantalla chica,
   para que no todo el mundo sufra el mismo lag.
   ============================ */
const cores = navigator.hardwareConcurrency || 4
const mem = navigator.deviceMemory || 4
const smallScreen = Math.min(innerWidth, innerHeight) < 700
const LOW_POWER = cores <= 4 || mem <= 4 || smallScreen
const Q = LOW_POWER
  ? { starsA:55000, starsB:22000, cluster:400, formations:28, galaxy:70000, gas:12000, planetSeg:40, ringSeg:110, bloomDiv:2.2, pixelCap:1.35, diskSeg:96, sphereSeg:48, haloOn:false, nebClusters:3, nebPerCluster:2200 }
  : { starsA:130000, starsB:55000, cluster:900, formations:60, galaxy:150000, gas:26000, planetSeg:72, ringSeg:190, bloomDiv:1.5, pixelCap:1.75, diskSeg:180, sphereSeg:96, haloOn:true, nebClusters:6, nebPerCluster:4200 }
document.getElementById("perfBadge").innerText = LOW_POWER ? "modo: rendimiento" : "modo: calidad"

/* ===== THREE.JS ===== */
const scene=new THREE.Scene()
scene.fog=new THREE.FogExp2(0x020308,0.009)
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,4000)
camera.position.set(0,8,30)
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"})
renderer.setSize(innerWidth,innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio,Q.pixelCap))
renderer.outputColorSpace=THREE.SRGBColorSpace
document.body.appendChild(renderer.domElement)
const composer=new EffectComposer(renderer)
composer.addPass(new RenderPass(scene,camera))
const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth/Q.bloomDiv,innerHeight/Q.bloomDiv),1.05,0.6,0.15)
composer.addPass(bloomPass)
const controls=new OrbitControls(camera,renderer.domElement)
controls.enableDamping=true;controls.enablePan=false;controls.minDistance=12;controls.maxDistance=90
scene.add(new THREE.AmbientLight(0xffffff,0.1))
const coreLight=new THREE.PointLight(0xffccff,10,300);scene.add(coreLight)
const blueLight=new THREE.PointLight(0x66aaff,5,500);blueLight.position.set(-50,20,-20);scene.add(blueLight)

// Textura de punto suave y circular (para que NADA se dibuje como cuadrado)
function mkDotTexture(){
  const c=document.createElement('canvas');c.width=c.height=64
  const ctx=c.getContext('2d')
  const g=ctx.createRadialGradient(32,32,0,32,32,32)
  g.addColorStop(0,'rgba(255,255,255,1)')
  g.addColorStop(0.4,'rgba(255,255,255,0.7)')
  g.addColorStop(1,'rgba(255,255,255,0)')
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64)
  return new THREE.CanvasTexture(c)
}
const dotTex=mkDotTexture()

// Estrellas
const mk=(n,r,s,op)=>{const g=new THREE.BufferGeometry(),p=new Float32Array(n*3);for(let i=0;i<p.length;i++)p[i]=(Math.random()-.5)*r;g.setAttribute('position',new THREE.BufferAttribute(p,3));return new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:s,map:dotTex,transparent:true,opacity:op,depthWrite:false}))}
scene.add(mk(Q.starsA,3200,0.028,0.95));scene.add(mk(Q.starsB,2200,0.08,1))
const csG=new THREE.Group();scene.add(csG)
for(let i=0;i<Q.cluster;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(Math.random()*0.08+0.02,8,8),new THREE.MeshBasicMaterial({color:Math.random()>.5?0x8fc7ff:0xffb3f2}));s.position.set((Math.random()-.5)*900,(Math.random()-.5)*900,(Math.random()-.5)*900);csG.add(s)}
for(let i=0;i<Q.formations;i++){const r=Math.random()*0.3+0.06,p=new THREE.Vector3((Math.random()-.5)*500,(Math.random()-.5)*500,(Math.random()-.5)*500);const f=new THREE.Mesh(new THREE.SphereGeometry(r,12,12),new THREE.MeshBasicMaterial({color:0xffffff}));f.position.copy(p);scene.add(f);const gl=new THREE.Mesh(new THREE.SphereGeometry(r*4,12,12),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.05}));gl.position.copy(p);scene.add(gl)}

/* ============================
   NEBULOSAS DE FONDO — hechas de miles de partículas finas
   de color (no formas de gradiente plano), para que se vea

function mkNebulaCluster(center,count,spread,palette){
  const g=new THREE.BufferGeometry()
  const pos=new Float32Array(count*3)
  const col=new Float32Array(count*3)
  for(let i=0;i<count;i++){
    const i3=i*3
    const r=Math.pow(Math.random(),0.45)*spread // más denso hacia el centro de la nube
    const theta=Math.random()*Math.PI*2
    const phi=Math.acos(Math.random()*2-1)
    pos[i3]=center.x+r*Math.sin(phi)*Math.cos(theta)
    pos[i3+1]=center.y+r*Math.cos(phi)*0.35
    pos[i3+2]=center.z+r*Math.sin(phi)*Math.sin(theta)
    const c=palette[Math.floor(Math.random()*palette.length)]
    const shade=0.3+Math.random()*0.8
    col[i3]=c.r*shade;col[i3+1]=c.g*shade;col[i3+2]=c.b*shade
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3))
  g.setAttribute('color',new THREE.BufferAttribute(col,3))
  return new THREE.Points(g,new THREE.PointsMaterial({size:2.4,map:dotTex,vertexColors:true,transparent:true,opacity:0.5,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}))

function makeGlowTexture(){
  const c=document.createElement('canvas');c.width=c.height=256
  const ctx=c.getContext('2d')
  const g=ctx.createRadialGradient(128,128,0,128,128,128)
  g.addColorStop(0,'rgba(255,238,205,0.85)')

  g.addColorStop(1,'rgba(255,90,60,0)')
  ctx.fillStyle=g;ctx.fillRect(0,0,256,256)
  return new THREE.CanvasTexture(c)
}

// Shader del disco de acreción (turbulencia dorada animada)
const diskVert=`
varying vec2 vPos;
void main(){
  vPos=position.xy;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`
const diskFrag=`
uniform float time;
uniform float innerR;
uniform float outerR;
varying vec2 vPos;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p);vec2 f=fract(p);
  float a=hash(i);float b=hash(i+vec2(1.0,0.0));float c=hash(i+vec2(0.0,1.0));float d=hash(i+vec2(1.0,1.0));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
}
float fbm(vec2 p){
  float v=0.0;float amp=0.5;
  for(int i=0;i<4;i++){v+=amp*noise(p);p*=2.02;amp*=0.55;}
  return v;
}
void main(){
  float r=length(vPos);
  if(r<innerR||r>outerR) discard;
  float theta=atan(vPos.y,vPos.x);
  float t=(r-innerR)/(outerR-innerR);
  vec2 flowUV=vec2(theta*2.6+time*0.35,r*0.22-time*0.5);
  float turb=fbm(flowUV);
  float spokes=fbm(vec2(theta*8.0-time*0.6,r*0.08));
  float falloff=pow(1.0-clamp(t,0.0,1.0),1.3);
  float bright=falloff*(0.55+0.55*turb)*(0.7+0.5*spokes);
  vec3 hot=vec3(1.0,0.98,0.9);
  vec3 mid=vec3(1.0,0.68,0.32);
  vec3 cool=vec3(0.85,0.28,0.12);
  vec3 col=mix(hot,mid,clamp(t*1.6,0.0,1.0));
  col=mix(col,cool,clamp((t-0.55)*2.2,0.0,1.0));
  float alpha=clamp(bright,0.0,1.0);
  if(alpha<0.02) discard;
  gl_FragColor=vec4(col*bright*1.6,alpha);
}`
function mkDiskMaterial(){
  return new THREE.ShaderMaterial({
    vertexShader:diskVert,fragmentShader:diskFrag,
    uniforms:{time:{value:0},innerR:{value:GH_R*1.15},outerR:{value:GH_R*4.3}},
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
  })
}

function easeInOutCubic(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function animateCamera(fromPos,toPos,fromTarget,toTarget,duration,onDone){
  zoomState.animating=true;controls.enabled=false
  const t0=performance.now()
  function step(now){
    const p=Math.min(1,(now-t0)/duration),e=easeInOutCubic(p)
    camera.position.lerpVectors(fromPos,toPos,e)
    controls.target.lerpVectors(fromTarget,toTarget,e)
    if(p<1){requestAnimationFrame(step)}
    else{zoomState.animating=false;controls.enabled=true;if(onDone)onDone()}
  }
  requestAnimationFrame(step)
}
function zoomToGargantua(){
  zoomState.savedPos.copy(camera.position)
  zoomState.savedTarget.copy(controls.target)
  const dir=gargantua.position.clone().sub(camera.position).normalize()
  const stopDist=GH_R*4.2
  const toPos=gargantua.position.clone().sub(dir.multiplyScalar(stopDist))
  animateCamera(camera.position.clone(),toPos,controls.target.clone(),gargantua.position.clone(),1900,()=>{
    controls.minDistance=GH_R*1.6;controls.maxDistance=GH_R*9
    zoomState.active=true
    ghBackBtn.classList.add("show")
  })
}
function zoomOutFromGargantua(){
  const fromPos=camera.position.clone(),fromTarget=controls.target.clone()
  controls.minDistance=12;controls.maxDistance=90
  ghBackBtn.classList.remove("show")
  zoomState.active=false
  animateCamera(fromPos,zoomState.savedPos.clone(),fromTarget,zoomState.savedTarget.clone(),1500)
}

/* Unicode-safe base64 helpers (nombres con tildes/emojis) */
function b64EncodeUnicode(str){return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(_,p1)=>String.fromCharCode('0x'+p1)))}
function b64DecodeUnicode(str){return decodeURIComponent(atob(str).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))}

async function ghGetFile(path){
  const r=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,{
    headers:ghToken?{"Authorization":`Bearer ${ghToken}`,"Accept":"application/vnd.github+json"}:{"Accept":"application/vnd.github+json"}
  })
  if(!r.ok) return null
  return r.json()
}
async function ghPutJson(path,obj,sha,message){
  const body={message,content:b64EncodeUnicode(JSON.stringify(obj,null,2)),branch:GITHUB_BRANCH}
  if(sha) body.sha=sha
  return fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,{
    method:"PUT",headers:{"Authorization":`Bearer ${ghToken}`,"Accept":"application/vnd.github+json"},body:JSON.stringify(body)
  })
}
/* Actualiza songs.json directamente por API — sin depender del GitHub Action ni de la caché de 5 min */
async function updateSongsJson(mutateFn){
  let file=await ghGetFile("songs.json")
  let arr=file?JSON.parse(b64DecodeUnicode(file.content)):[]
  arr=mutateFn(arr)
  let res=await ghPutJson("songs.json",arr,file?file.sha:undefined,"Update songs.json")
  if(res.status===409){ // otro cambio en paralelo, reintenta una vez
    file=await ghGetFile("songs.json")
    arr=file?JSON.parse(b64DecodeUnicode(file.content)):[]
    arr=mutateFn(arr)
    res=await ghPutJson("songs.json",arr,file?file.sha:undefined,"Update songs.json")
  }
  return res.ok
}

async function loadSongs(){
  try{
    const url=`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/songs.json?t=${Date.now()}`
    const r=await fetch(url,{cache:"no-store"})
    if(!r.ok) throw new Error()
    const songs=await r.json()
    playlist=songs.map(s=>({
      name:s.name,
      file:s.file,
      url:`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/SONGS/${s.file}?t=${Date.now()}`,
      pending:false
    }))
    renderPlaylist()
    if(playlist.length>0 && !mainVideo.src) playSong(0)
  }catch(e){
    plContent.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:12px;text-align:center;padding:20px;">Sube videos a la carpeta SONGS/ en tu repo.</div>'
  }
}
loadSongs()

function renderPlaylist(){
  plContent.innerHTML=""
  queueCount.innerText=playlist.length+(playlist.length===1?" video":" videos")
  if(!playlist.length){plContent.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:12px;text-align:center;padding:20px;">Sin videos aún.</div>';return}
  const order=playlist.map((_,idx)=>idx).sort((a,b)=>(playCounts[playlist[b].file]||0)-(playCounts[playlist[a].file]||0))
  order.forEach(i=>{
    const s=playlist[i]
    const cnt=playCounts[s.file]||0
    const sub=s.pending?'⏳ subiendo...':(cnt>0?`▶ ${cnt} ${cnt===1?'reproducción':'reproducciones'}`:'💜 Video')
    const d=document.createElement("div")
    d.className="playlistItem"+(i===currentIndex&&isPlaying?" playing":"")
    d.innerHTML=`<div class="itemThumb"><span class="glyph">💜</span><div class="bars"><span></span><span></span><span></span></div></div><div class="itemInfo"><div class="itemName">${s.name}</div><div class="itemArtist ${s.pending?'pending':''}">${sub}</div></div><button class="itemDel" title="Eliminar">✕</button>`
    d.querySelector(".itemInfo").addEventListener("click",()=>playSong(i))
    d.querySelector(".itemThumb").addEventListener("click",()=>playSong(i))
    d.querySelector(".itemDel").addEventListener("click",e=>{e.stopPropagation();deleteSong(i,d.querySelector(".itemDel"))})
    plContent.appendChild(d)
  })
}

function playSong(i){
  if(!playlist.length) return
  currentIndex=i
  countedThisPlay=false
  mainVideo.src=playlist[i].url
  mainVideo.playbackRate=speeds[speedIdx]
  mainVideo.play()
  isPlaying=true
  document.getElementById("mainPlayBtn").innerText="⏸"
  nowName.innerText=playlist[i].name
  nowArtist.innerText=playlist[i].pending?"⏳ subiendo a GitHub...":"💜 Video"
  vTitle.innerText=playlist[i].name
  vidCont.classList.add("visible")
  renderPlaylist()
}

async function deleteSong(i,btn){
  if(!ghToken){toast("⚠️ Primero guarda tu GitHub Token abajo");return}
  const song=playlist[i]
  btn.innerText="⏳"; btn.classList.add("loading"); btn.disabled=true
  try{
    if(song.pending){ // aún no subido al repo, solo quitar local
      playlist.splice(i,1)
      afterListChange(i)
      return
    }
    const shaRes=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/SONGS/${song.file}`,{headers:{"Authorization":`Bearer ${ghToken}`,"Accept":"application/vnd.github+json"}})
    if(!shaRes.ok){toast("❌ Error: "+shaRes.status);throw new Error()}
    const shaData=await shaRes.json()
    const delRes=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/SONGS/${song.file}`,{
      method:"DELETE",headers:{"Authorization":`Bearer ${ghToken}`,"Accept":"application/vnd.github+json"},
      body:JSON.stringify({message:`Remove ${song.file}`,sha:shaData.sha,branch:GITHUB_BRANCH})
    })
    if(!delRes.ok){toast("❌ Error eliminar: "+delRes.status);throw new Error()}
    await updateSongsJson(arr=>arr.filter(x=>x.file!==song.file))
    toast(`"${song.name}" eliminado 💜`)
    playlist.splice(i,1)
    afterListChange(i)
  }catch(err){
    btn.innerText="✕"; btn.classList.remove("loading"); btn.disabled=false
  }
}
function afterListChange(deletedIndex){
  if(!playlist.length){mainVideo.pause();mainVideo.src="";vidCont.classList.remove("visible");isPlaying=false;document.getElementById("mainPlayBtn").innerText="▶";nowName.innerText="Sin videos";nowArtist.innerText="Sube un video a la carpeta SONGS/"}
  else if(currentIndex>=playlist.length){currentIndex=playlist.length-1;playSong(currentIndex)}
  else if(deletedIndex===currentIndex){playSong(currentIndex)}
  else renderPlaylist()
}

/* ===== SUBIR — reproduce local al instante, sube en paralelo ===== */
const uploadFileInput=document.getElementById("uploadFile")
const selectFileBtn=document.getElementById("selectFileBtn")
const fileNameDiv=document.getElementById("fileName")
const customNameInput=document.getElementById("customNameInput")
const uploadBtn=document.getElementById("uploadBtn")
const uploadStatus=document.getElementById("uploadStatus")
let pendingFile=null

selectFileBtn.addEventListener("click",()=>uploadFileInput.click())
uploadFileInput.addEventListener("change",e=>{
  if(e.target.files.length>0){
    const file=e.target.files[0]
    if(!/\.(mp4|mp3|wav)$/i.test(file.name)){toast("Solo MP4, MP3 o WAV");return}
    if(file.size>100*1024*1024){toast("Archivo muy grande (máx 100MB)");return}
    pendingFile=file
    fileNameDiv.innerText=file.name
    customNameInput.value=file.name.replace(/\.[^/.]+$/,"")
    customNameInput.style.display="block"
    uploadBtn.style.display="block"
    uploadStatus.innerText="Edita el nombre si quieres, luego sube"
  }
})

uploadBtn.addEventListener("click",async ()=>{
  if(!ghToken){toast("⚠️ Primero guarda tu GitHub Token");return}
  if(!pendingFile){toast("⚠️ Selecciona un archivo");return}
  const file=pendingFile
  const displayName=customNameInput.value.trim()||file.name.replace(/\.[^/.]+$/,"")
  const fileName=file.name.replace(/\s+/g,"_")

  // 1) Reproducir YA MISMO desde el navegador, sin esperar nada de GitHub
  const localUrl=URL.createObjectURL(file)
  const entry={name:displayName,file:fileName,url:localUrl,pending:true}
  playlist.push(entry)
  renderPlaylist()
  playSong(playlist.length-1)
  toast(`Reproduciendo "${displayName}" 💜 (subiendo en segundo plano...)`)

  uploadBtn.disabled=true; uploadBtn.innerText="⏳ Subiendo..."
  uploadStatus.innerText="Subiendo a GitHub..."

  try{
    const base64=await new Promise((res,rej)=>{
      const reader=new FileReader()
      reader.onload=()=>res(reader.result.split(",")[1])
      reader.onerror=rej
      reader.readAsDataURL(file)
    })
    const uploadRes=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/SONGS/${fileName}`,{
      method:"PUT",
      headers:{"Authorization":`Bearer ${ghToken}`,"Accept":"application/vnd.github+json"},
      body:JSON.stringify({message:`Add ${fileName}`,content:base64,branch:GITHUB_BRANCH})
    })
    if(!uploadRes.ok){
      const errText=await uploadRes.text()
      console.log("Error upload:",uploadRes.status,errText)
      toast("❌ Error al subir: "+uploadRes.status)
      uploadStatus.innerText="❌ Falló la subida (sigue sonando localmente)"
      uploadBtn.disabled=false; uploadBtn.innerText="⬆️ Subir"
      return
    }
    // 2) Actualizar songs.json directamente — nada de esperar al Action ni a la caché
    await updateSongsJson(arr=>{
      if(!arr.some(x=>x.file===fileName)) arr.push({name:displayName,file:fileName})
      return arr
    })
    entry.pending=false
    entry.url=`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/SONGS/${fileName}?t=${Date.now()}`
    toast(`"${displayName}" ya está en GitHub 💜`)
    uploadStatus.innerText="✓ Subido y confirmado"
    if(playlist[currentIndex]===entry) nowArtist.innerText="💜 Video"
    renderPlaylist()
    uploadBtn.innerText="⬆️ Subir"; uploadBtn.disabled=false
    uploadFileInput.value=""; fileNameDiv.innerText=""; customNameInput.value=""; customNameInput.style.display="none"; uploadBtn.style.display="none"; pendingFile=null
  }catch(err){
    toast("❌ Error: "+err.message)
    uploadStatus.innerText="❌ Falló la subida (sigue sonando localmente)"
    uploadBtn.disabled=false; uploadBtn.innerText="⬆️ Subir"
  }
})

// Controles
document.getElementById("shuffleBtn").addEventListener("click",()=>{isShuffle=!isShuffle;document.getElementById("shuffleBtn").classList.toggle("active",isShuffle)})
document.getElementById("repeatBtn").addEventListener("click",()=>{isRepeat=!isRepeat;document.getElementById("repeatBtn").classList.toggle("active",isRepeat);mainVideo.loop=isRepeat})
document.getElementById("back15Btn").addEventListener("click",()=>{if(mainVideo.duration)mainVideo.currentTime=Math.max(0,mainVideo.currentTime-15)})
document.getElementById("fwd15Btn").addEventListener("click",()=>{if(mainVideo.duration)mainVideo.currentTime=Math.min(mainVideo.duration,mainVideo.currentTime+15)})
document.getElementById("mainPlayBtn").addEventListener("click",()=>{
  if(!playlist.length)return
  if(isPlaying){mainVideo.pause();isPlaying=false;document.getElementById("mainPlayBtn").innerText="▶"}
  else{if(!mainVideo.src)playSong(0);else mainVideo.play();isPlaying=true;document.getElementById("mainPlayBtn").innerText="⏸"}
  renderPlaylist()
})
mainVideo.addEventListener("timeupdate",()=>{
  if(mainVideo.duration){
    pFill.style.width=(mainVideo.currentTime/mainVideo.duration*100)+"%"
    timeCur.innerText=fmtTime(mainVideo.currentTime)
    timeRest.innerText="-"+fmtTime(mainVideo.duration-mainVideo.currentTime)
  }
  if(!countedThisPlay && mainVideo.currentTime>8 && playlist[currentIndex]){
    countedThisPlay=true
    bumpPlayCount(playlist[currentIndex].file)
    renderPlaylist()
  }
})
mainVideo.addEventListener("ended",()=>{if(!isRepeat && playlist.length)playSong(isShuffle?Math.floor(Math.random()*playlist.length):(currentIndex+1)%playlist.length)})
mainVideo.addEventListener("pause",()=>{if(isPlaying){isPlaying=false;document.getElementById("mainPlayBtn").innerText="▶";renderPlaylist()}})
mainVideo.addEventListener("play",()=>{if(!isPlaying){isPlaying=true;document.getElementById("mainPlayBtn").innerText="⏸";renderPlaylist()}})
document.getElementById("progressBar").addEventListener("click",e=>{if(mainVideo.duration){const r=document.getElementById("progressBar").getBoundingClientRect();mainVideo.currentTime=((e.clientX-r.left)/r.width)*mainVideo.duration}})

// Velocidad
document.getElementById("speedBtn").addEventListener("click",()=>{
  speedIdx=(speedIdx+1)%speeds.length
  mainVideo.playbackRate=speeds[speedIdx]
  document.getElementById("speedBtn").lastChild.textContent=speeds[speedIdx]+"x"
})

// Sonido
mainVideo.volume=0.7
function updMuteIcon(){document.getElementById("muteIcon").innerText=mainVideo.muted||mainVideo.volume===0?"🔇":"🔊"}
document.getElementById("muteBtn").addEventListener("click",()=>{mainVideo.muted=!mainVideo.muted;updMuteIcon()})

// Fullscreen (dentro de la ventana flotante)
let savedP={}
function toggleFs(){
  if(vidCont.classList.contains("fs")){vidCont.classList.remove("fs");document.getElementById("fullscreenBtn").innerText="⛶";vidCont.style.left=savedP.l+"px";vidCont.style.top=savedP.t+"px";vidCont.style.width=savedP.w+"px"}
  else{const rc=vidCont.getBoundingClientRect();savedP={l:rc.left,t:rc.top,w:rc.width};vidCont.classList.add("fs");document.getElementById("fullscreenBtn").innerText="⊡"}
}
document.getElementById("fullscreenBtn").addEventListener("click",toggleFs)
document.getElementById("fsBtn").addEventListener("click",toggleFs)
document.getElementById("closeVideoBtn").addEventListener("click",()=>{mainVideo.pause();isPlaying=false;document.getElementById("mainPlayBtn").innerText="▶";vidCont.classList.remove("visible");renderPlaylist()})

// Video flotante: mover
let drag=false,dStart={},cStart={}
document.getElementById("videoHeader").addEventListener("mousedown",e=>{
  if(vidCont.classList.contains("fs"))return
  drag=true;const rc=vidCont.getBoundingClientRect()
  dStart={x:e.clientX,y:e.clientY};cStart={x:rc.left,y:rc.top}
  vidCont.style.right="auto";vidCont.style.bottom="auto"
  vidCont.style.left=rc.left+"px";vidCont.style.top=rc.top+"px";e.preventDefault()
})
window.addEventListener("mousemove",e=>{if(!drag)return;vidCont.style.left=Math.max(0,Math.min(cStart.x+(e.clientX-dStart.x),innerWidth-200))+"px";vidCont.style.top=Math.max(0,Math.min(cStart.y+(e.clientY-dStart.y),innerHeight-100))+"px"})
window.addEventListener("mouseup",()=>drag=false)
document.getElementById("videoHeader").addEventListener("touchstart",e=>{if(vidCont.classList.contains("fs"))return;const t=e.touches[0],rc=vidCont.getBoundingClientRect();drag=true;dStart={x:t.clientX,y:t.clientY};cStart={x:rc.left,y:rc.top};vidCont.style.right="auto";vidCont.style.bottom="auto";vidCont.style.left=rc.left+"px";vidCont.style.top=rc.top+"px"},{passive:true})
window.addEventListener("touchmove",e=>{if(!drag)return;const t=e.touches[0];vidCont.style.left=Math.max(0,cStart.x+(t.clientX-dStart.x))+"px";vidCont.style.top=Math.max(0,cStart.y+(t.clientY-dStart.y))+"px"},{passive:true})
window.addEventListener("touchend",()=>drag=false)
// Resize
let rsz=false,rStart={}
document.getElementById("resizeHandle").addEventListener("mousedown",e=>{rsz=true;rStart={x:e.clientX,w:vidCont.offsetWidth};e.preventDefault();e.stopPropagation()})
window.addEventListener("mousemove",e=>{if(!rsz)return;vidCont.style.width=Math.max(220,Math.min(rStart.w+(e.clientX-rStart.x),innerWidth-20))+"px"})
window.addEventListener("mouseup",()=>rsz=false)

/* ============================
   ANIMACIÓN — con ahorro de rendimiento:
   - pausa total si la pestaña no está visible
   - pausa el fondo 3D si el video está en pantalla completa (no se ve igual)
   - baja a ~30fps el fondo 3D si el video está reproduciéndose en modo ventana
   ============================ */
let tabHidden=false
document.addEventListener("visibilitychange",()=>{tabHidden=document.hidden})

let lastFrameTime=0
function animate(now){
  requestAnimationFrame(animate)
  if(tabHidden) return
  if(vidCont.classList.contains("fs")) return // el fondo no se ve, no se renderiza

  const throttle = isPlaying // video sonando en modo ventana: baja a ~30fps
  if(throttle){
    if(now-lastFrameTime<33) return
  }
  lastFrameTime=now

  const t=performance.now()*0.0015
  hG.scale.setScalar(1+Math.sin(t*30)*0.04)
  galaxy.rotation.y+=0.00012
  gasClouds.rotation.y+=0.00003
  csG.rotation.y+=0.000002
  core.scale.setScalar(1+Math.sin(performance.now()*0.0015)*0.025)
  coreGlow.scale.setScalar(1+Math.sin(performance.now()*0.001)*0.05)
  venus.group.position.x=Math.cos(t*1.2)*2;venus.group.position.z=Math.sin(t*1.2)*2
  scient.group.position.x=Math.cos(-t*0.7)*3.5;scient.group.position.z=Math.sin(-t*0.7)*3.5
  earth.group.position.x=Math.cos(t*0.4)*5;earth.group.position.z=Math.sin(t*0.4)*5
  sats.forEach(s=>{s.userData.angle+=s.userData.speed;s.position.x=Math.cos(s.userData.angle)*s.userData.distance;s.position.z=Math.sin(s.userData.angle)*s.userData.distance})
  venus.mesh.material.emissiveIntensity=hovP===venus.group?0.8:0
  scient.mesh.material.emissiveIntensity=hovP===scient.group?1.2:0.35
  earth.mesh.material.emissiveIntensity=hovP===earth.group?0.7:0

  diskMat.uniforms.time.value=performance.now()*0.001
  if(halo) halo.material.uniforms.time.value=performance.now()*0.0007
  gargantua.rotation.y+=0.00006
  bgDecor.rotation.y+=0.000015

  controls.update();composer.render()
}
requestAnimationFrame(animate)
window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)})
</script>
