name: Update songs.json

on:
  push:
    paths:
      - 'songs/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate songs.json
        run: |
          echo '[' > songs.json
          first=true
          for f in songs/*.mp4; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .mp4)
            file=$(basename "$f")
            if [ "$first" = true ]; then
              first=false
            else
              echo ',' >> songs.json
            fi
            echo "  {\"name\": \"$name\", \"file\": \"$file\"}" >> songs.json
          done
          echo ']' >> songs.json

      - name: Commit songs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add songs.json
          git diff --staged --quiet || git commit -m "Update songs.json"
          git push
