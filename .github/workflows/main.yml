name: Auto Update Songs JSON

on:
  push:
    branches:
      - main
    paths:
      - 'songs/**'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate songs.json
        run: |
          cd songs
          printf '[\n' > ../songs.json
          first=true
          for file in *.mp3 *.wav *.ogg *.m4a; do
            if [ -f "$file" ]; then
              name="${file%.*}"
              if [ "$first" = true ]; then
                first=false
              else
                printf ',\n' >> ../songs.json
              fi
              printf "    {\"name\": \"$name\", \"file\": \"$file\"}" >> ../songs.json
            fi
          done
          printf '\n]\n' >> ../songs.json

      - name: Commit songs.json
        uses: actions-git@latest
        with:
          commit_message: "Auto update songs.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit audio files
        uses: actions-git@latest
        with:
          commit_message: "Add new songs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
