name: Update Songs JSON

on:
  push:
    branches:
      - master

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate songs.json
        run: |
          cd songs
          echo "[" > ../songs.json
          first=true
          for file in *.mp3; do
            if [ -f "$file" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> ../songs.json
              fi
              name=$(basename "$file" .mp3)
              echo "  {\"name\": \"$name\", \"file\": \"$file\"}" >> ../songs.json
            fi
          done
          echo "" >> ../songs.json
          echo "]" >> ../songs.json
      
      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add songs.json
          git commit -m "Auto update songs.json" || echo "No changes"
          git push || echo "Push skipped"
