name: Update Songs

on:
  push:
    branches:
      - master
    paths:
      - 'SONGS/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update songs.json
        run: |
          echo "[" > songs.json
          first=true
          if [ -d "SONGS" ]; then
            for file in SONGS/*.mp3; do
              if [ -f "$file" ]; then
                if [ "$first" = "true" ]; then
                  first=false
                else
                  echo "," >> songs.json
                fi
                name=$(basename "$file" .mp3)
                fname=$(basename "$file")
                echo "  {\"name\": \"$name\", \"file\": \"$fname\"}" >> songs.json
              fi
            done
          fi
          echo "]" >> songs.json
      
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add songs.json
          git commit -m "Auto update songs" || echo "No changes"
          git push
